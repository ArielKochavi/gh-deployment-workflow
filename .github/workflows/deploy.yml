name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Fix 1: Explicitly grant permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from overlapping
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Fix 2: Attach the deployment environment to output the page URL
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lynx python3

      - name: Start local web server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Checking the website
        run: curl -I http://localhost:8080

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4